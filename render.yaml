services:
  - type: web
    name: command-grid
    runtime: python
    plan: free
    numInstances: 1
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: STORAGE_SECRET
        generateValue: true
      - key: NICEGUI_RELOAD
        value: "false"
